# iOS builds run on Codemagic's Macs (we have no Mac). Started by hand only.
workflows:
  ios-check:
    name: iOS check build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.3
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Install iOS packages
        script: cd ios && pod install --repo-update
      - name: Build without signing
        script: flutter build ios --release --no-codesign
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

  ios-test:
    name: iOS simulator test
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.3
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Install iOS packages
        script: cd ios && pod install --repo-update
      - name: Open the app on 3 iPhone sizes
        script: bash scripts/ios_sim_test.sh integration_test/ios_launch_test.dart
        ignore_failure: true
      - name: Unit tests
        script: flutter test test/
        ignore_failure: true
    artifacts:
      - ios_test_output/**

  # Start with "Enable SSH/VNC access" ticked: the owner types the number and
  # SMS code on the simulator over VNC, then the journey runs by itself.
  ios-journey:
    name: iOS full journey (owner logs in)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: 3.47.3
      xcode: latest
      cocoapods: default
      vars:
        IOS_SIM_SIZES: middle
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Install iOS packages
        script: cd ios && pod install --repo-update
      - name: Customer journey
        script: bash scripts/ios_sim_test.sh integration_test/app_journey_test.dart --dart-define=E2E_MANUAL_LOGIN=true
    artifacts:
      - ios_test_output/**
