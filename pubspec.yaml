name: arobo_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.2
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3
  intl: ^0.19.0
  scroll_snap_list: ^0.9.1
  flutter_svg: ^2.1.0
  permission_handler: ^11.3.0
  flutter_contacts: ^1.1.6
  pdf: ^3.10.4
  printing: ^5.11.0
  path_provider: ^2.1.0
  cupertino_icons: ^1.0.8
  dropdown_button2: ^2.3.9
  carousel_slider: ^5.0.0
  sizer: ^2.0.15
  lottie: ^3.1.0
  auto_size_text: ^3.0.0
  pinput: ^5.0.1
  scrollable_list_tab_scroller: ^3.1.1
  flutter_touch_ripple: ^2.7.1
  ntp: ^2.0.0
  firebase_core: ^3.12.1
  firebase_app_check: ^0.3.2+4
  firebase_messaging: ^15.2.4
  firebase_crashlytics: ^4.3.7
  flutter_local_notifications: ^18.0.1
  animated_rating_stars: ^1.0.1
  device_info_plus: ^11.3.0
  google_maps_flutter: ^2.10.1
  dotted_line: ^3.2.3
  razorpay_flutter: ^1.4.4
  shimmer: ^3.0.0
  logger: ^2.4.0
  infinite_scroll_pagination: ^5.1.1
  shimmer_ai: ^1.3.0
  socket_io_client: ^2.0.3+1
  google_fonts: ^6.3.2
  freezed_annotation: 2.4.1
  freezed: 2.4.6
  json_annotation: 4.8.1
  focus_detector: ^2.0.1
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  table_calendar: ^3.1.3
  cached_network_image_ce: ^4.6.4
  animate_do: ^3.0.2
  http: ^1.6.0
  share_plus: ^7.2.1
  visibility_detector: ^0.2.2
  vibration: ^3.1.3
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: 6.7.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/backgrounds/
    - assets/images/cover/
    - assets/images/img/
    - assets/images/icons/
    - assets/images/icons/icons/LocationArrow/
    - assets/images/icons/icons/Calendar/
    - assets/images/icons/icons/User/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  # Lives outside assets/images/ (and outside any pubspec `assets:` entry) on
  # purpose — this is a build-time input for icon generation only, never
  # referenced by Dart code at runtime, so it must never be bundled into the
  # shipped APK as a Flutter asset.
  image_path: "assets/launcher_icon_source/app_icon3.png"
  adaptive_icon_background: "#FFF200"
  adaptive_icon_foreground: "assets/launcher_icon_source/app_icon3.png"

flutter_native_splash:
  # No logo image here on purpose — the Android 12+ SplashScreen API forces
  # any icon into a small square slot, and aorbologo.png is a wide wordmark
  # (1183x330px), which got scaled-and-cropped into an unreadable fragment.
  # Only the background color needs to match splash_screen.dart's gradient
  # start color (#FEF200) — that's what makes the native→Flutter handoff
  # invisible. The full, correctly-proportioned logo reveal happens entirely
  # inside splash_screen.dart's own animation, moments later.
  image: "assets/images/img/transparent.png"
  color: "#FEF200"
  android: true
  ios: true

  android_12:
    image: "assets/images/img/transparent.png"
    icon_background_color: "#FEF200"
    color: "#FEF200"